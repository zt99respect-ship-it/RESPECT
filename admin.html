<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — ساحة ريسبكت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
  body{
    background:#0a0414;color:#f3e8ff;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;position:relative;font-weight:700;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(139,92,246,.28), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(167,139,250,.22), transparent 50%);
    animation:bgMove 18s ease-in-out infinite alternate;
    z-index:-1;pointer-events:none;
  }
  @keyframes bgMove{0%{transform:scale(1) rotate(0);}100%{transform:scale(1.15) rotate(4deg);}}

  .container{
    max-width:560px;width:100%;
    background:rgba(139,92,246,.07);
    border:1px solid rgba(167,139,250,.18);
    border-radius:24px;
    padding:32px 26px;
    backdrop-filter:blur(16px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  h1{
    font-size:1.8rem;font-weight:900;text-align:center;
    background:linear-gradient(90deg,#8b5cf6,#a78bfa,#8b5cf6);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 3s linear infinite;
    margin-bottom:6px;
  }
  @keyframes shine{to{background-position:200% center;}}
  .subtitle{text-align:center;color:#a78bfa;font-size:.85rem;margin-bottom:26px;letter-spacing:2px;}

  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:.85rem;margin-bottom:8px;
    color:#a78bfa;font-weight:800;
  }
  .field input, .field textarea{
    width:100%;padding:13px 16px;border-radius:12px;
    border:1px solid rgba(167,139,250,.25);
    background:rgba(0,0,0,.3);
    color:#f3e8ff;font-size:.95rem;outline:none;
    font-family:'Cairo',sans-serif;font-weight:600;
    transition:.3s;resize:vertical;
  }
  .field input:focus, .field textarea:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 25px rgba(139,92,246,.5);
  }
  .field textarea{min-height:100px;}

  .btn{
    width:100%;padding:14px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);
    color:#fff;font-weight:900;cursor:pointer;
    font-family:'Cairo',sans-serif;font-size:1rem;
    transition:.3s;margin-top:8px;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .btn svg{width:20px;height:20px;}
  .btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(139,92,246,.6);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .btn.secondary{
    background:transparent;
    border:1px solid rgba(167,139,250,.25);
    color:#f3e8ff;
  }
  .btn.secondary:hover{
    border-color:#8b5cf6;background:rgba(139,92,246,.15);
    box-shadow:none;
  }

  .login-box, .main-box{display:none;}
  .login-box.show, .main-box.show{display:block;}

  .preview-img{
    width:100%;border-radius:12px;margin-top:10px;
    max-height:200px;object-fit:cover;
    border:1px solid rgba(167,139,250,.25);
  }

  .result{
    padding:14px 18px;border-radius:12px;
    margin-top:16px;font-size:.9rem;font-weight:700;
    display:none;
  }
  .result.show{display:block;animation:fadeUp .3s ease;}
  .result.success{background:rgba(34,197,94,.15);border:1px solid #22c55e;color:#22c55e;}
  .result.error{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fecaca;}

  .info{
    background:rgba(139,92,246,.1);
    border:1px solid rgba(167,139,250,.25);
    border-radius:12px;padding:12px 16px;
    font-size:.82rem;color:#a78bfa;
    margin-bottom:20px;line-height:1.6;
  }

  .icon-circle{
    width:70px;height:70px;margin:0 auto 16px;
    border-radius:50%;
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 40px rgba(139,92,246,.55);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .icon-circle svg{width:36px;height:36px;color:#fff;}

  .counter{
    text-align:center;
    font-size:.85rem;color:#a78bfa;
    margin-top:20px;padding:12px;
    background:rgba(139,92,246,.08);
    border-radius:12px;
    border:1px solid rgba(167,139,250,.2);
  }
  .counter b{color:#f3e8ff;font-weight:900;font-size:1.1rem;}

  @media(max-width:500px){
    .container{padding:24px 20px;border-radius:20px;}
    h1{font-size:1.5rem;}
    .subtitle{font-size:.75rem;}
  }
</style>
</head>
<body>

<div class="container">

  <!-- Login -->
  <div class="login-box show" id="loginBox">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>لوحة الإدارة</h1>
    <div class="subtitle">SAHA RESPECT ADMIN</div>

    <div class="field">
      <label>كلمة السر</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>

    <button class="btn" onclick="login()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      دخول
    </button>

    <div class="result error" id="loginError"></div>
  </div>

  <!-- Main -->
  <div class="main-box" id="mainBox">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </div>
    <h1>إرسال إشعار</h1>
    <div class="subtitle">SAHA RESPECT NOTIFICATIONS</div>

    <div class="info">
      💡 اكتب العنوان والنص، ثم اضغط "إرسال". الإشعار يوصل لكل المستخدمين فوراً — حتى لو الموقع مغلق.
    </div>

    <div class="field">
      <label>عنوان الإشعار</label>
      <input type="text" id="titleInput" placeholder="مثال: 🔴 DRB7H بدأ البث!">
    </div>

    <div class="field">
      <label>نص الإشعار</label>
      <textarea id="bodyInput" placeholder="مثال: تعالوا شوفوا البث الجديد 🔥"></textarea>
    </div>

    <div class="field">
      <label>رابط صورة (اختياري)</label>
      <input type="url" id="imageInput" placeholder="https://example.com/image.jpg" oninput="previewImage()">
      <img id="imagePreview" class="preview-img" style="display:none;">
    </div>

    <div class="field">
      <label>رابط يفتح عند الضغط (اختياري)</label>
      <input type="url" id="urlInput" placeholder="https://zt99respect-ship-it.github.io/RESPECT/">
    </div>

    <button class="btn" onclick="sendNotification()" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      إرسال الإشعار
    </button>

    <button class="btn secondary" onclick="logout()" style="margin-top:10px;">
      🚪 خروج
    </button>

    <div class="result" id="sendResult"></div>

    <div class="counter">
      الأجهزة المسجلة: <b id="deviceCount">—</b>
      <button onclick="refreshDeviceCount()" style="background:transparent;border:none;color:#a78bfa;cursor:pointer;font-family:Cairo;font-size:.75rem;text-decoration:underline;margin-right:8px;">تحديث</button>
    </div>
  </div>

</div>

<script>
const ADMIN_PASSWORD = 'RespectSaha2025!';
const WORKER_URL = 'https://saha-proxy.zt-99-respect.workers.dev';

function login(){
  const pass = document.getElementById('passwordInput').value;
  if(pass !== ADMIN_PASSWORD){
    const err = document.getElementById('loginError');
    err.textContent = '❌ كلمة السر خطأ';
    err.classList.add('show');
    setTimeout(()=>err.classList.remove('show'), 3000);
    return;
  }
  sessionStorage.setItem('admin_logged', 'true');
  showMain();
}

function logout(){
  sessionStorage.removeItem('admin_logged');
  document.getElementById('mainBox').classList.remove('show');
  document.getElementById('loginBox').classList.add('show');
  document.getElementById('passwordInput').value = '';
}

function showMain(){
  document.getElementById('loginBox').classList.remove('show');
  document.getElementById('mainBox').classList.add('show');
  refreshDeviceCount();
}

if(sessionStorage.getItem('admin_logged') === 'true'){ showMain(); }

document.getElementById('passwordInput').addEventListener('keypress', e=>{
  if(e.key === 'Enter') login();
});

function previewImage(){
  const url = document.getElementById('imageInput').value.trim();
  const img = document.getElementById('imagePreview');
  if(url){
    img.src = url;
    img.style.display = 'block';
    img.onerror = ()=> img.style.display = 'none';
  } else {
    img.style.display = 'none';
  }
}

async function sendNotification(){
  const title = document.getElementById('titleInput').value.trim();
  const body = document.getElementById('bodyInput').value.trim();
  const image = document.getElementById('imageInput').value.trim();
  const url = document.getElementById('urlInput').value.trim();
  const result = document.getElementById('sendResult');
  const btn = document.getElementById('sendBtn');

  result.classList.remove('show', 'success', 'error');

  if(!title || !body){
    result.textContent = '❌ العنوان والنص مطلوبان';
    result.classList.add('show', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = '...جاري الإرسال';

  try{
    const res = await fetch(`${WORKER_URL}/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        password: ADMIN_PASSWORD,
        title, body,
        image: image || null,
        url: url || 'https://zt99respect-ship-it.github.io/RESPECT/'
      })
    });

    const data = await res.json();

    if(data.success){
      result.textContent = `✅ تم الإرسال بنجاح — وصل إلى ${data.sent} جهاز${data.failed > 0 ? ` (فشل ${data.failed})` : ''}`;
      result.classList.add('show', 'success');
      document.getElementById('titleInput').value = '';
      document.getElementById('bodyInput').value = '';
      document.getElementById('imageInput').value = '';
      document.getElementById('urlInput').value = '';
      document.getElementById('imagePreview').style.display = 'none';
    } else {
      result.textContent = '❌ ' + (data.error || 'فشل الإرسال');
      result.classList.add('show', 'error');
    }
  }catch(err){
    console.error(err);
    result.textContent = '❌ خطأ في الاتصال: ' + err.message;
    result.classList.add('show', 'error');
  }finally{
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> إرسال الإشعار';
  }
}

async function refreshDeviceCount(){
  const el = document.getElementById('deviceCount');
  el.textContent = '...';
  try{
    const res = await fetch(`${WORKER_URL}/device-count`);
    const data = await res.json();
    el.textContent = data.success ? data.count : 'خطأ';
  }catch(e){
    el.textContent = '—';
  }
}
</script>

</body>
</html>
