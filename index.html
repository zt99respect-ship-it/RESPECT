<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساحة ريسبكت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#8b5cf6;--purple-dark:#6d28d9;--purple-light:#a78bfa;
    --purple-glow:rgba(139,92,246,.55);
    --bg:#0a0414;--glass:rgba(139,92,246,.07);--glass-border:rgba(167,139,250,.18);
    --text:#f3e8ff;--danger:#ef4444;--success:#22c55e;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative;font-weight:700;}

  body::before{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(139,92,246,.18), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(167,139,250,.14), transparent 50%);
    animation:bgMove 18s ease-in-out infinite alternate;
    z-index:-2;pointer-events:none;
  }
  body::after{
    content:'';position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(139,92,246,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.03) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;pointer-events:none;
  }
  @keyframes bgMove{0%{transform:scale(1) rotate(0);}100%{transform:scale(1.15) rotate(4deg);}}

  nav{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;
    background:rgba(10,4,20,.8);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--glass-border);
    transition:transform .35s,opacity .35s;
  }
  nav.hidden{transform:translateY(-100%);opacity:0;pointer-events:none;}
  nav .logo{
    display:flex;align-items:center;gap:10px;
    font-weight:900;font-size:1.15rem;
    background:linear-gradient(90deg,var(--purple),var(--purple-light));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  nav .logo svg{width:28px;height:28px;color:var(--purple);}
  nav .links{display:flex;gap:8px;}
  nav button{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid var(--glass-border);color:var(--text);
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.85rem;
    font-family:'Cairo',sans-serif;font-weight:700;
    transition:.25s;
  }
  nav button svg{width:16px;height:16px;}
  nav button:hover{
    background:var(--glass);border-color:var(--purple);
    box-shadow:0 0 15px var(--purple-glow);transform:translateY(-2px);
  }

  header{text-align:center;padding:50px 20px 20px;animation:fadeDown .8s ease;}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-30px);}to{opacity:1;transform:translateY(0);}}
  header h1{
    font-size:3.2rem;font-weight:900;
    background:linear-gradient(90deg,var(--purple),var(--purple-light),var(--purple));
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s linear infinite;
    text-shadow:0 0 40px rgba(139,92,246,.35);
    letter-spacing:-1px;
    line-height:1.3;
  }
  @keyframes shine{to{background-position:200% center;}}
  header p{
    margin-top:10px;letter-spacing:10px;
    color:var(--purple-light);font-weight:900;
    font-size:1.05rem;
    animation:pulseText 2.5s ease-in-out infinite;
  }
  @keyframes pulseText{0%,100%{opacity:.5;}50%{opacity:1;}}

  .divider{
    max-width:200px;height:2px;margin:20px auto;
    background:linear-gradient(90deg,transparent,var(--purple),transparent);
    box-shadow:0 0 20px var(--purple-glow);
    animation:dividerPulse 3s ease-in-out infinite;
  }
  @keyframes dividerPulse{0%,100%{opacity:.4;width:100px;}50%{opacity:1;width:200px;}}

  .search-box{
    max-width:700px;margin:24px auto;padding:0 20px;
    display:flex;gap:10px;
    animation:fadeUp .8s ease .15s both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
  .search-box input{
    flex:1;padding:15px 20px;border-radius:14px;
    border:1px solid var(--glass-border);
    background:var(--glass);backdrop-filter:blur(12px);
    color:var(--text);font-size:1rem;outline:none;transition:.3s;
    font-family:'Cairo',sans-serif;font-weight:700;
  }
  .search-box input::placeholder{color:rgba(243,232,255,.45);font-weight:600;}
  .search-box input:focus{
    border-color:var(--purple);
    box-shadow:0 0 25px var(--purple-glow);
    background:rgba(139,92,246,.12);
  }
  .search-box button{
    display:flex;align-items:center;gap:8px;
    padding:15px 26px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--purple),var(--purple-dark));
    color:#fff;font-weight:800;cursor:pointer;transition:.3s;
    position:relative;overflow:hidden;
    font-family:'Cairo',sans-serif;font-size:.95rem;
  }
  .search-box button svg{width:18px;height:18px;}
  .search-box button::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
    transform:translateX(-100%);
    transition:transform .6s;
  }
  .search-box button:hover::before{transform:translateX(100%);}
  .search-box button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px var(--purple-glow);
  }
  .search-box button:active{transform:scale(.96);}

  .section{max-width:1200px;margin:30px auto;padding:0 20px;}
  .section h2{
    font-size:1.25rem;margin-bottom:16px;
    color:var(--text);font-weight:900;
    display:flex;align-items:center;gap:10px;
  }
  .section h2 svg{
    width:22px;height:22px;
    color:var(--purple);
    filter:drop-shadow(0 0 8px var(--purple-glow));
    animation:iconFloat 2.5s ease-in-out infinite;
  }
  @keyframes iconFloat{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-4px) rotate(5deg);}}

  .scroll-row{
    display:flex;gap:14px;overflow-x:auto;
    padding:8px 4px 18px;
    scrollbar-width:thin;
    scrollbar-color:var(--purple-dark) transparent;
  }
  .scroll-row::-webkit-scrollbar{height:6px;}
  .scroll-row::-webkit-scrollbar-thumb{background:var(--purple-dark);border-radius:6px;}

  .channel-card{
    min-width:170px;max-width:170px;
    background:var(--glass);backdrop-filter:blur(12px);
    border:1px solid var(--glass-border);border-radius:16px;
    padding:16px 12px;cursor:pointer;transition:.35s;
    text-align:center;position:relative;overflow:hidden;
    animation:cardIn .5s ease both;
  }
  @keyframes cardIn{from{opacity:0;transform:scale(.85) translateY(15px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .channel-card:hover{
    transform:translateY(-6px) scale(1.04);
    border-color:var(--purple);
    box-shadow:0 12px 35px var(--purple-glow);
  }
  .channel-card .avatar-wrap{position:relative;display:inline-block;margin-bottom:10px;}
  .channel-card img{
    width:64px;height:64px;border-radius:50%;
    object-fit:cover;background:#2a1a4a;
    border:2px solid var(--purple-dark);transition:.35s;
  }
  .channel-card:hover img{border-color:var(--purple);box-shadow:0 0 20px var(--purple-glow);}
  .channel-card .live-ring{
    position:absolute;inset:-4px;border:2px solid var(--danger);
    border-radius:50%;animation:liveRing 1.8s ease-out infinite;pointer-events:none;
  }
  @keyframes liveRing{0%{transform:scale(1);opacity:1;}100%{transform:scale(1.25);opacity:0;}}
  .channel-card .name{font-size:.92rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .channel-card .viewers{
    font-size:.8rem;color:var(--purple-light);margin-top:6px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .channel-card .viewers svg{width:14px;height:14px;}

  .fav-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--glass);border:1px solid var(--glass-border);
    color:var(--text);padding:10px 16px;border-radius:12px;
    cursor:pointer;font-size:.88rem;transition:.3s;
    font-family:'Cairo',sans-serif;font-weight:700;
  }
  .fav-btn:hover{
    border-color:var(--purple);background:rgba(139,92,246,.12);
    transform:translateY(-2px);box-shadow:0 6px 18px var(--purple-glow);
  }
  .fav-btn svg{width:14px;height:14px;color:var(--purple);}
  .fav-btn .x{color:var(--danger);font-weight:900;padding:0 4px;transition:.25s;}
  .fav-btn .x:hover{transform:scale(1.3);}

  .player-container{max-width:1200px;margin:20px auto 60px;padding:0 20px;animation:fadeUp .8s ease .3s both;}

  .video-wrapper{
    position:relative;background:#000;border-radius:18px;overflow:hidden;
    border:1px solid var(--glass-border);
    box-shadow:0 0 50px rgba(139,92,246,.25);
    aspect-ratio:16/9;transition:box-shadow .35s;
  }
  .video-wrapper:hover{box-shadow:0 0 70px var(--purple-glow);}
  .video-wrapper.pseudo-fs{
    position:fixed;top:0;left:0;right:0;bottom:0;
    width:100vw;height:100vh;z-index:9999;border-radius:0;aspect-ratio:auto;background:#000;
  }
  #player{width:100%;height:100%;background:#000;display:block;}
  .video-wrapper.pseudo-fs #player{width:100vw;height:100vh;object-fit:contain;}

  .placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    color:var(--purple-light);text-align:center;padding:20px;
  }
  .placeholder svg{
    width:80px;height:80px;animation:float 3s ease-in-out infinite;
    color:var(--purple);filter:drop-shadow(0 0 20px var(--purple-glow));
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}

  .stats-bar{
    display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding:14px 16px;
    background:var(--glass);backdrop-filter:blur(12px);
    border:1px solid var(--glass-border);border-radius:14px;font-size:.9rem;
    animation:fadeUp .5s ease;
  }
  .stats-bar .stat{
    display:flex;align-items:center;gap:8px;padding:6px 12px;
    background:rgba(139,92,246,.1);border-radius:10px;transition:.25s;
    font-weight:700;
  }
  .stats-bar .stat:hover{background:rgba(139,92,246,.2);}
  .stats-bar .stat svg{width:16px;height:16px;color:var(--purple-light);}
  .stats-bar .stat b{color:var(--text);font-weight:800;}

  .controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
  .controls select,.controls button{
    display:flex;align-items:center;gap:8px;
    padding:11px 18px;border-radius:12px;
    border:1px solid var(--glass-border);
    background:var(--glass);backdrop-filter:blur(12px);
    color:var(--text);cursor:pointer;transition:.3s;
    font-size:.9rem;font-weight:800;
    font-family:'Cairo',sans-serif;
  }
  .controls svg{width:16px;height:16px;}
  .controls button:hover,.controls select:hover{
    border-color:var(--purple);background:rgba(139,92,246,.15);
    box-shadow:0 0 20px var(--purple-glow);transform:translateY(-2px);
  }
  .controls button.recording{
    background:var(--danger);border-color:var(--danger);animation:pulseRec 1.2s infinite;
  }
  @keyframes pulseRec{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7);}50%{box-shadow:0 0 0 14px rgba(239,68,68,0);}}
  .live-badge{
    display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
    background:linear-gradient(135deg,var(--danger),#b91c1c);
    color:#fff;border-radius:20px;font-size:.82rem;font-weight:900;
    letter-spacing:.5px;animation:livePulse 1.6s infinite;
  }
  .live-badge::before{content:'';width:8px;height:8px;background:#fff;border-radius:50%;}
  @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6);}50%{box-shadow:0 0 0 8px rgba(239,68,68,0);}}

  footer{
    text-align:center;padding:30px;color:rgba(167,139,250,.6);
    font-size:.88rem;font-weight:700;
    border-top:1px solid var(--glass-border);margin-top:40px;
  }

  @media(max-width:600px){
    header h1{font-size:2.1rem;}
    header p{letter-spacing:6px;font-size:.88rem;}
    .search-box{flex-direction:column;}
    .search-box button{width:100%;justify-content:center;}
    nav{padding:10px 14px;}
    nav button{padding:6px 10px;font-size:.75rem;}
    .controls button,.controls select{padding:9px 14px;font-size:.82rem;}
    .channel-card{min-width:150px;max-width:150px;}
    .channel-card img{width:56px;height:56px;}
  }

  .toast-area{position:fixed;top:80px;left:20px;z-index:99999;display:flex;flex-direction:column;gap:10px;}
  .toast{
    display:flex;align-items:center;gap:10px;
    background:rgba(139,92,246,.95);backdrop-filter:blur(10px);
    color:#fff;padding:12px 18px;border-radius:12px;
    box-shadow:0 8px 28px rgba(0,0,0,.5);
    animation:toastIn .4s ease,toastOut .4s ease 4.6s forwards;
    font-size:.9rem;font-weight:800;max-width:300px;
    font-family:'Cairo',sans-serif;
  }
  .toast svg{width:18px;height:18px;flex-shrink:0;}
  @keyframes toastIn{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateX(-40px);}}

  .rec-result{
    margin-top:14px;padding:14px 18px;border-radius:14px;
    background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(139,92,246,.1));
    border:1px solid var(--success);
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;animation:fadeUp .5s ease;
  }
  .rec-result .msg{display:flex;align-items:center;gap:8px;font-weight:800;}
  .rec-result .msg svg{width:20px;height:20px;color:var(--success);}
  .rec-result a{
    display:flex;align-items:center;gap:6px;
    color:#fff;background:var(--purple);padding:10px 18px;border-radius:10px;
    text-decoration:none;font-size:.9rem;font-weight:800;transition:.25s;
    font-family:'Cairo',sans-serif;
  }
  .rec-result a:hover{background:var(--purple-dark);transform:translateY(-2px);box-shadow:0 6px 18px var(--purple-glow);}
  .rec-result a svg{width:16px;height:16px;}
</style>
</head>
<body>

<nav id="navbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="23 7 16 12 23 17 23 7"></polygon>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
    </svg>
    ساحة ريسبكت
  </div>
  <div class="links">
    <button onclick="go('liveSection')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/>
      </svg>
      المباشر
    </button>
    <button onclick="go('favSection')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      المفضلة
    </button>
    <button onclick="go('playerSection')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      المشغل
    </button>
  </div>
</nav>

<header>
  <h1>ساحة ريسبكت</h1>
  <p>RESPECT</p>
  <div class="divider"></div>
</header>

<div class="search-box">
  <input type="text" id="channelInput" placeholder="اكتب اسم قناة Kick هنا..." />
  <button onclick="loadStream()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
    شاهد البث
  </button>
</div>

<div class="section" id="liveSection">
  <h2>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    </svg>
    قنوات مباشرة الآن
  </h2>
  <div class="scroll-row" id="liveRow">
    <div style="color:var(--purple-light);font-size:.88rem;">جاري التحميل...</div>
  </div>
</div>

<div class="section" id="favSection">
  <h2>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
    المفضلة
  </h2>
  <div class="scroll-row" id="favRow">
    <div style="color:var(--purple-light);font-size:.88rem;">لا يوجد قنوات مفضلة بعد</div>
  </div>
</div>

<div class="player-container" id="playerSection">
  <div class="video-wrapper" id="videoWrapper">
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <p style="font-size:1.1rem;font-weight:800;">اكتب اسم قناة واضغط "شاهد البث"</p>
      <p style="font-size:.85rem;opacity:.6;font-weight:600;">مثال: klash</p>
    </div>
    <video id="player" controls playsinline style="display:none"></video>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
      <b id="statChannel">-</b>
    </div>
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <b id="statViewers">0</b> مشاهد
    </div>
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
      <b id="statCategory">-</b>
    </div>
    <div class="stat" id="statLiveWrap" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" fill="#ef4444" stroke="none"/></svg>
      <b>مباشر</b>
    </div>
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <b id="statFav">-</b>
    </div>
  </div>

  <div class="controls">
    <select id="qualitySelect">
      <option value="best">أفضل جودة</option>
      <option value="1080p">1080p</option>
      <option value="720p">720p</option>
      <option value="480p">480p</option>
      <option value="360p">360p</option>
      <option value="worst">أقل جودة</option>
    </select>
    <button onclick="toggleFullscreen()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      ملء الشاشة
    </button>
    <button onclick="toggleRecord()" id="recBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      تسجيل
    </button>
    <button onclick="saveClip()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
      كليب (30 ث)
    </button>
    <button onclick="toggleFavFromPlayer()" id="favBtnPlayer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      مفضلة
    </button>
    <button onclick="stopStream()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      إيقاف
    </button>
    <span class="live-badge" id="liveBadge" style="display:none">LIVE</span>
  </div>

  <div id="recResultWrap"></div>
</div>

<footer>© 2025 ساحة ريسبكت — جميع الحقوق محفوظة</footer>
<div class="toast-area" id="toastArea"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
/* ============ إعدادات ============ */
const PROXY = 'https://saha-proxy.zt-99-respect.workers.dev';
function proxied(path){ return `${PROXY}?path=${encodeURIComponent(path)}`; }
function streamProxy(u){ return `${PROXY}?url=${encodeURIComponent(u)}`; }

const FEATURED = [
  'DRB7H','S5B','PEERLESS','HOOK','FHLWY','F1AISAL','ID7O',
  'Musab','Abu8aly','Rayan','Imonky_d','Okb','wolf','AnwarBMA',
  'w1pey','islf','ko3ib'
];

function go(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }

function toast(msg, type){
  const area = document.getElementById('toastArea');
  const t = document.createElement('div');
  t.className='toast';
  const icon = type === 'error'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
  t.innerHTML = icon + '<span>'+msg+'</span>';
  area.appendChild(t);
  setTimeout(()=>t.remove(), 5200);
}

/* ============ Favorites ============ */
const FAV_KEY = 'saha_respect_favs';
const getFavs = ()=>{ try{ return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }catch{ return []; } };
const setFavs = (a)=>{ localStorage.setItem(FAV_KEY, JSON.stringify(a)); renderFavs(); };

function toggleFav(ch){
  ch = ch.toLowerCase();
  const favs = getFavs();
  const i = favs.indexOf(ch);
  if(i>-1){ favs.splice(i,1); toast(`تمت إزالة ${ch}`); }
  else{ favs.push(ch); toast(`أُضيفت ${ch} للمفضلة`); }
  setFavs(favs);
  if(currentChannel) updateFavButton(currentChannel);
}
function toggleFavFromPlayer(){
  if(!currentChannel){ toast('لا يوجد بث مفتوح','error'); return; }
  toggleFav(currentChannel);
}
function updateFavButton(ch){
  const btn = document.getElementById('favBtnPlayer');
  const isFav = getFavs().includes(ch.toLowerCase());
  btn.innerHTML = `
    <svg viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    ${isFav ? 'في المفضلة' : 'مفضلة'}`;
  document.getElementById('statFav').textContent = isFav ? 'نعم' : 'لا';
}
function renderFavs(){
  const row = document.getElementById('favRow');
  const favs = getFavs();
  row.innerHTML='';
  if(favs.length===0){
    row.innerHTML='<div style="color:var(--purple-light);font-size:.88rem;">لا يوجد قنوات مفضلة بعد</div>';
    return;
  }
  favs.forEach(ch=>{
    const el = document.createElement('button');
    el.className='fav-btn';
    el.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      ${ch}
      <span class="x">✕</span>`;
    el.onclick = (e)=>{
      if(e.target.classList.contains('x')){ e.stopPropagation(); toggleFav(ch); return; }
      document.getElementById('channelInput').value = ch;
      loadStream();
    };
    row.appendChild(el);
  });
}
renderFavs();

/* ============ Live Channels ============ */
async function loadLiveChannels(){
  const row = document.getElementById('liveRow');
  row.innerHTML = '<div style="color:var(--purple-light);font-size:.88rem;">جاري التحميل...</div>';

  const results = await Promise.all(FEATURED.map(async ch => {
    try{
      const res = await fetch(proxied(`/api/v2/channels/${ch.toLowerCase()}`));
      if(!res.ok) return null;
      const data = await res.json();
      const isLive = !!(data.playback_url || data.livestream);
      if(!isLive) return null;
      return {
        slug: ch,
        pic: data.user?.profile_pic || '',
        viewers: data.viewers_count ?? data.livestream?.viewer_count ?? 0
      };
    }catch(e){ return null; }
  }));

  const live = results.filter(Boolean);
  row.innerHTML='';
  if(live.length===0){
    row.innerHTML='<div style="font-size:.88rem;color:var(--purple-light);">لا يوجد بث مباشر حالياً</div>';
    return;
  }

  live.sort((a,b)=>b.viewers-a.viewers);
  live.forEach((r,i)=>{
    const card = document.createElement('div');
    card.className='channel-card';
    card.style.animationDelay=(i*0.05)+'s';
    card.innerHTML = `
      <div class="avatar-wrap">
        <img src="${r.pic}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><rect fill=%22%236d28d9%22 width=%2260%22 height=%2260%22/><text x=%2230%22 y=%2238%22 fill=%22white%22 font-size=%2224%22 text-anchor=%22middle%22>?</text></svg>'">
        <span class="live-ring"></span>
      </div>
      <div class="name">${r.slug}</div>
      <div class="viewers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        ${(r.viewers||0).toLocaleString()}
      </div>
    `;
    card.onclick = ()=>{
      document.getElementById('channelInput').value = r.slug;
      loadStream();
    };
    row.appendChild(card);
  });
}
loadLiveChannels();

/* ============ Player ============ */
let hlsInstance = null;
let currentChannel = null;
let mediaRecorder = null;
let recordedChunks = [];
let clipBuffer = [];
let clipRecorder = null;
let isRecording = false;

async function fetchChannelData(ch){
  const res = await fetch(proxied(`/api/v2/channels/${ch}`));
  if(!res.ok) throw new Error('القناة غير موجودة');
  return await res.json();
}

async function loadStream(){
  const channel = document.getElementById('channelInput').value.trim().toLowerCase();
  if(!channel){ toast('اكتب اسم القناة','error'); return; }
  currentChannel = channel;

  const placeholder = document.getElementById('placeholder');
  const player = document.getElementById('player');
  const liveBadge = document.getElementById('liveBadge');
  const statsBar = document.getElementById('statsBar');
  document.getElementById('recResultWrap').innerHTML='';

  placeholder.style.display='flex';
  placeholder.innerHTML = '<p style="animation:pulseText 1s infinite">جاري تحميل البث...</p>';
  player.style.display='none';
  statsBar.style.display='none';

  try{
    const data = await fetchChannelData(channel);
    const pic = data.user?.profile_pic || '';
    const viewers = data.viewers_count ?? data.livestream?.viewer_count ?? 0;
    const category = data.recent_categories?.[0]?.name || '-';
    let m3u8 = data.playback_url || data.livestream?.playback_url;

    document.getElementById('statChannel').textContent = channel;
    document.getElementById('statViewers').textContent = viewers.toLocaleString();
    document.getElementById('statCategory').textContent = category;
    document.getElementById('statLiveWrap').style.display = m3u8 ? 'flex' : 'none';
    statsBar.style.display='flex';
    updateFavButton(channel);

    if(!m3u8){
      placeholder.innerHTML = `
        <img src="${pic}" style="width:120px;height:120px;border-radius:50%;border:3px solid var(--purple);object-fit:cover;background:#2a1a4a;box-shadow:0 0 30px var(--purple-glow);" onerror="this.style.display='none'">
        <p style="font-size:1.4rem;font-weight:900;">${channel}</p>
        <p style="color:var(--danger);font-weight:800;">غير مباشر حالياً</p>
        ${category!=='-' ? '<p style="font-size:.88rem;opacity:.7;">الفئة: '+category+'</p>' : ''}
      `;
      return;
    }

    // تمرير البث عبر Worker
    m3u8 = streamProxy(m3u8);

    if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }
    if(clipRecorder){ try{ clipRecorder.stop(); }catch(e){} clipRecorder=null; }
    clipBuffer = [];

    if(Hls.isSupported()){
      hlsInstance = new Hls({lowLatencyMode:true, enableWorker:true});
      hlsInstance.loadSource(m3u8);
      hlsInstance.attachMedia(player);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, ()=>{
        applyQuality();
        player.play().catch(()=>{});
        startClipRecorder();
      });
      hlsInstance.on(Hls.Events.ERROR, (e,d)=>{
        if(d.fatal){
          placeholder.style.display='flex';
          placeholder.innerHTML='<p>⚠ فشل تحميل البث</p>';
          player.style.display='none';
        }
      });
    } else if(player.canPlayType('application/vnd.apple.mpegurl')){
      player.src = m3u8; player.play(); startClipRecorder();
    } else {
      throw new Error('متصفحك لا يدعم HLS');
    }

    placeholder.style.display='none';
    player.style.display='block';
    liveBadge.style.display='inline-flex';

  } catch(err){
    console.error(err);
    placeholder.style.display='flex';
    player.style.display='none';
    liveBadge.style.display='none';
    placeholder.innerHTML = `<p>❌ ${err.message}</p>`;
  }
}

function applyQuality(){
  if(!hlsInstance) return;
  const q = document.getElementById('qualitySelect').value;
  const levels = hlsInstance.levels;
  if(!levels || levels.length===0) return;
  let target = -1;
  if(q==='best') target = levels.length-1;
  else if(q==='worst') target = 0;
  else{
    const h = parseInt(q);
    let min = Infinity;
    levels.forEach((lvl,i)=>{ const d = Math.abs(lvl.height-h); if(d<min){min=d;target=i;} });
  }
  hlsInstance.currentLevel = target;
}
document.getElementById('qualitySelect').addEventListener('change', applyQuality);

function stopStream(){
  if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }
  if(mediaRecorder && isRecording){ mediaRecorder.stop(); }
  if(clipRecorder){ try{ clipRecorder.stop(); }catch(e){} clipRecorder=null; }
  const player = document.getElementById('player');
  player.pause(); player.removeAttribute('src'); player.load();
  player.style.display='none';
  document.getElementById('liveBadge').style.display='none';
  document.getElementById('statsBar').style.display='none';
  const ph = document.getElementById('placeholder');
  ph.style.display='flex';
  ph.innerHTML='<p>تم إيقاف البث</p>';
  currentChannel = null;
}

/* ============ Fullscreen ============ */
function toggleFullscreen(){
  const w = document.getElementById('videoWrapper');
  const nav = document.getElementById('navbar');
  const player = document.getElementById('player');

  if(!document.fullscreenElement && w.requestFullscreen){
    w.requestFullscreen().then(()=>{
      nav.classList.add('hidden');
      player.style.objectFit='contain';
    }).catch(()=>{
      w.classList.add('pseudo-fs');
      nav.classList.add('hidden');
      player.style.objectFit='contain';
      toast('وضع ملء الشاشة');
    });
  } else if(document.fullscreenElement){
    document.exitFullscreen().then(()=>{
      nav.classList.remove('hidden');
    });
  } else {
    w.classList.toggle('pseudo-fs');
    nav.classList.toggle('hidden');
    if(w.classList.contains('pseudo-fs')){
      player.style.objectFit='contain';
      toast('وضع ملء الشاشة');
    } else {
      player.style.objectFit='';
    }
  }
}
document.addEventListener('fullscreenchange', ()=>{
  const nav = document.getElementById('navbar');
  if(document.fullscreenElement) nav.classList.add('hidden');
  else nav.classList.remove('hidden');
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    const w = document.getElementById('videoWrapper');
    if(w.classList.contains('pseudo-fs')){
      w.classList.remove('pseudo-fs');
      document.getElementById('navbar').classList.remove('hidden');
      document.getElementById('player').style.objectFit='';
    }
  }
});

/* ============ Recording ============ */
function getStream(){
  const p = document.getElementById('player');
  if(p.captureStream) return p.captureStream();
  if(p.mozCaptureStream) return p.mozCaptureStream();
  return null;
}

function toggleRecord(){
  if(!currentChannel){ toast('افتح بث أولاً','error'); return; }
  const btn = document.getElementById('recBtn');
  if(!isRecording){
    const stream = getStream();
    if(!stream){ toast('التسجيل غير مدعوم','error'); return; }
    recordedChunks = [];
    try{ mediaRecorder = new MediaRecorder(stream, {mimeType:'video/webm'}); }
    catch(e){
      try{ mediaRecorder = new MediaRecorder(stream); }
      catch(e2){ toast('التسجيل غير مدعوم','error'); return; }
    }
    mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(recordedChunks, {type:'video/webm'});
      const url = URL.createObjectURL(blob);
      showResult(url, `تسجيل_${currentChannel}_${Date.now()}.webm`, 'تم حفظ التسجيل');
    };
    mediaRecorder.start();
    isRecording = true;
    btn.classList.add('recording');
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      إيقاف التسجيل`;
    toast('بدأ التسجيل...');
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('recording');
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      تسجيل`;
  }
}

/* ============ Clip ============ */
function startClipRecorder(){
  const stream = getStream();
  if(!stream) return;
  clipBuffer = [];
  try{ clipRecorder = new MediaRecorder(stream, {mimeType:'video/webm'}); }
  catch(e){ return; }
  clipRecorder.ondataavailable = e=>{
    if(e.data.size>0){
      clipBuffer.push({time: Date.now(), data: e.data});
      const cutoff = Date.now() - 30000;
      clipBuffer = clipBuffer.filter(c=>c.time >= cutoff);
    }
  };
  try{ clipRecorder.start(1000); }catch(e){}
}

function saveClip(){
  if(!clipBuffer || clipBuffer.length===0){ toast('انتظر شوي','error'); return; }
  const chunks = clipBuffer.map(c=>c.data);
  const blob = new Blob(chunks, {type:'video/webm'});
  const url = URL.createObjectURL(blob);
  showResult(url, `كليب_${currentChannel}_${Date.now()}.webm`, 'تم حفظ الكليب');
}

function showResult(url, filename, msg){
  const wrap = document.getElementById('recResultWrap');
  const box = document.createElement('div');
  box.className='rec-result';
  box.innerHTML = `
    <span class="msg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      ${msg}
    </span>
    <a href="${url}" download="${filename}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      تحميل الملف
    </a>
  `;
  wrap.innerHTML='';
  wrap.appendChild(box);
  toast(msg);
}

/* ============ Notifications ============ */
async function requestNotifPerm(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    try{ await Notification.requestPermission(); }catch(e){}
  }
}
requestNotifPerm();

async function checkFavsLive(){
  const favs = getFavs();
  if(favs.length===0) return;
  if(Notification.permission !== 'granted') return;
  const status = JSON.parse(sessionStorage.getItem('fav_live_status') || '{}');
  for(const ch of favs){
    try{
      const res = await fetch(proxied(`/api/v2/channels/${ch}`));
      if(!res.ok) continue;
      const data = await res.json();
      const isLive = !!(data.playback_url || data.livestream);
      if(isLive && !status[ch]){
        try{
          new Notification('بث مباشر الآن!', {
            body: `${ch} بدأ البث على Kick`,
            icon: data.user?.profile_pic
          });
        }catch(e){}
        toast(`${ch} بدأ البث!`);
        status[ch] = true;
      } else if(!isLive && status[ch]){
        status[ch] = false;
      }
    }catch(e){}
  }
  sessionStorage.setItem('fav_live_status', JSON.stringify(status));
}
setInterval(checkFavsLive, 60000);
setTimeout(checkFavsLive, 5000);

document.getElementById('channelInput').addEventListener('keypress', e=>{
  if(e.key === 'Enter') loadStream();
});
</script>
